[package]
name = "oracle-stacks"
version = "0.1.0"
edition = "2021"
description = "Oracle Bridge device protocol stacks (DLMS, OCPP, SunSpec, OpenADR)"

[dependencies]
oracle-core = { path = "../oracle-core" }
anyhow = "1.0"
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
uuid = { version = "1.10", features = ["v4", "v5", "serde"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
aes-gcm = "0.10"
crc32fast = "1.4"

[dev-dependencies]
tokio = { version = "1.48", features = ["rt", "macros"] }
