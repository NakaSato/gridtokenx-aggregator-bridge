[package]
name = "oracle-protocol"
version = "0.1.0"
edition = "2021"
description = "GridTokenX Oracle Bridge - generated ConnectRPC/Buffa protocol types (oracle, dispatch, identity)"

[dependencies]
# ConnectRPC + Buffa runtime (consumed by generated code)
connectrpc = { version = "0.2.1", features = ["server", "client"] }
buffa = { version = "0.2.0", features = ["json"] }
http = "1.0.0"
http-body = "1.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures = "0.3"

[build-dependencies]
buffa-build = "0.2.0"
connectrpc-build = "0.2.0"
