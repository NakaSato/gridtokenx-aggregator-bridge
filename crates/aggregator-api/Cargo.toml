[package]
name = "aggregator-api"
version = "0.1.0"
edition = "2021"
description = "GridTokenX Aggregator Bridge - API/app layer (HTTP + ConnectRPC transport, ingestion, auth, telemetry, AppState)"

[dependencies]
aggregator-core = { path = "../aggregator-core" }
aggregator-stacks = { path = "../aggregator-stacks" }
aggregator-protocol = { path = "../aggregator-protocol" }
aggregator-persistence = { path = "../aggregator-persistence" }
aggregator-logic = { path = "../aggregator-logic" }
gridtokenx-telemetry = { path = "../../../gridtokenx-telemetry" }

# Async runtime
tokio = { version = "1.48", features = ["rt-multi-thread", "macros", "io-util", "time", "sync", "signal", "parking_lot"] }
tokio-util = "0.7.18"

# Web framework
axum = { version = "0.8.7", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6.7", features = ["cors", "trace"] }

# gRPC / proto runtime
connectrpc = { version = "0.2.1", features = ["server", "client"] }
buffa = { version = "0.2.0", features = ["json"] }
http = "1.0.0"
http-body = "1.0.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Cache / messaging
redis = { version = "0.32", features = ["tokio-comp", "connection-manager"] }

# Utils
futures = "0.3"
anyhow = "1.0"
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "v5", "serde"] }
rust_decimal = { version = "1.36.0", features = ["serde-float", "maths"] }
hex = "0.4.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Metrics
metrics = "0.24"

[dev-dependencies]
# Build secure v4 DLMS frames in-test to exercise decode_secure_frame's policy matrix.
aes-gcm = "0.10"
crc32fast = "1.4"
