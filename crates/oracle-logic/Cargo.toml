[package]
name = "oracle-logic"
version = "0.1.0"
edition = "2021"
description = "GridTokenX Oracle Bridge - domain services & orchestration (aggregator, router, dispatch, standards, zk, metrics)"

[dependencies]
oracle-core = { path = "../oracle-core" }
oracle-stacks = { path = "../oracle-stacks" }
oracle-protocol = { path = "../oracle-protocol" }
gridtokenx-blockchain-core = { version = "0.1.0", path = "../../../gridtokenx-blockchain-core" }

# Messaging / cache / http client
redis = { version = "0.32", features = ["tokio-comp", "connection-manager"] }
async-nats = "0.37"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }

# Async
tokio = { version = "1.48", features = ["rt-multi-thread", "macros", "time", "sync"] }
async-trait = "0.1"

# gRPC / proto runtime
connectrpc = { version = "0.2.1", features = ["server", "client"] }
buffa = { version = "0.2.0", features = ["json"] }
http = "1.0.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Utils
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "v5", "serde"] }
rust_decimal = { version = "1.36.0", features = ["serde-float", "maths"] }
tracing = "0.1"

# Metrics
metrics = "0.24"
metrics-exporter-prometheus = "0.17"
