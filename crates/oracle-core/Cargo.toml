[package]
name = "oracle-core"
version = "0.1.0"
edition = "2021"
description = "Oracle Bridge pure domain types and numeric helpers"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "v5", "serde"] }
anyhow = "1.0"
rust_decimal = { version = "1.36.0", features = ["serde-float", "maths"] }
