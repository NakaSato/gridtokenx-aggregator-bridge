[workspace]
members = ["crates/*"]

[package]
name = "gridtokenx-oracle-bridge"
version = "0.1.0"
edition = "2021"
description = "GridTokenX Oracle Bridge + IoT Gateway - Unified ingestion and on-chain synchronization"

[dependencies]
# Async runtime
tokio = { version = "1.48", features = ["rt-multi-thread", "macros", "io-util", "time", "sync", "signal", "parking_lot"] }
tokio-util = "0.7.18"

# Web framework (HTTP gateway entrypoint)
axum = { version = "0.8.7", features = ["macros"] }

# gRPC server/client wiring
connectrpc = { version = "0.2.1", features = ["server", "client"] }
http = "1.0.0"

# Cache / messaging clients used at startup
redis = { version = "0.32", features = ["tokio-comp", "connection-manager"] }
async-nats = "0.37"

# Metrics exporter
metrics = "0.24"
metrics-exporter-prometheus = "0.17"

# Utils
anyhow = "1.0"
dotenvy = "0.15"
tracing = "0.1"

# Application layer (re-exports logic/persistence/protocol/stacks/core)
oracle-api = { path = "crates/oracle-api" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = 'abort'
strip = true
