[workspace]
members = ["crates/*"]

[package]
name = "gridtokenx-aggregator-bridge"
version = "0.1.0"
edition = "2021"
description = "GridTokenX Aggregator Bridge + IoT Gateway - Unified ingestion and on-chain synchronization"

[dependencies]
# Async runtime
tokio = { version = "1.48", features = ["rt-multi-thread", "macros", "io-util", "time", "sync", "signal", "parking_lot"] }
tokio-util = "0.7.18"
# Billing-bin window math (grace duration for the InfluxDB billing sink)
chrono = "0.4"

# Web framework (HTTP gateway entrypoint)
axum = { version = "0.8.7", features = ["macros"] }
# Optional TLS termination for the IoT gateway (encrypts DLMS/COSEM telemetry in
# transit). Uses the same rustls 0.23 provider installed in main().
axum-server = { version = "0.7", features = ["tls-rustls"] }
# Load PEM cert chains + client-CA roots when building the mTLS ServerConfig.
rustls-pemfile = "2"

# gRPC server/client wiring
connectrpc = { version = "0.2.1", features = ["server", "client"] }
http = "1.0.0"

# Cache / messaging clients used at startup
redis = { version = "0.32", features = ["tokio-comp", "connection-manager"] }
# Durable meter-owner source of truth (shared gridtokenx Postgres) — read-only,
# degraded-safe pool built at startup and handed to the MeterRegistry DB tier.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres"] }

# Metrics exporter
metrics = "0.24"
metrics-exporter-prometheus = "0.17"

# Utils
anyhow = "1.0"
dotenvy = "0.15"
tracing = "0.1"
# Pin the process-level CryptoProvider: the dependency graph enables both ring and
# aws-lc-rs, and rustls 0.23 panics on provider ambiguity unless main() installs one.
rustls = { version = "0.23", features = ["ring"] }

# Application layer (re-exports logic/persistence/protocol/stacks/core)
aggregator-api = { path = "crates/aggregator-api" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = 'abort'
# strip MUST stay off: `strip = true` also strips the sqlx_macros proc-macro
# dylib, mis-aligning its Mach-O LINKEDIT on macOS (Darwin 27) so rustc's dlopen
# fails ("mis-aligned LINKEDIT string pool") — the release build then dies with a
# misleading sqlx E0432 (unresolved Encode/Decode/FromRow/Type). Debug is fine
# (no strip). Strip the final binary in packaging instead if size matters.
strip = false
