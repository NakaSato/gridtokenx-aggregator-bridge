[package]
name = "gridtokenx-oracle-bridge"
version = "0.1.0"
edition = "2021"
description = "GridTokenX Oracle Bridge + IoT Gateway - Unified ingestion and on-chain synchronization"

[dependencies]
# Async Runtime
tokio = { version = "1.48", features = ["rt-multi-thread", "macros", "io-util", "time", "sync", "signal", "parking_lot"] }
futures = "0.3"
async-trait = "0.1"

# Web Framework (IoT Gateway)
axum = { version = "0.8.7", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6.7", features = ["cors", "trace"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Caching/Events
redis = { version = "0.32", features = ["tokio-comp", "connection-manager"] }

# Utils
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "v5", "serde"] }
rust_decimal = { version = "1.36.0", features = ["serde-float", "maths"] }
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# OpenTelemetry (SigNoz integration)
opentelemetry = "0.21"
opentelemetry-otlp = "0.14"
opentelemetry-semantic-conventions = "0.13"
tonic = "0.12.3"
opentelemetry_sdk = "0.21"
tracing-opentelemetry = "0.22"
dotenvy = "0.15"
bs58 = "0.5"
ed25519-dalek = "2.1"
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }

# HTTP Client for API Gateway communication
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
  "gzip",
] }

# gRPC
connectrpc = { version = "0.2.1", features = ["server", "client"] }
buffa = { version = "0.2.0", features = ["json"] }
http-body = "1.0.0"
http = "1.0.0"

# Metrics
metrics = "0.24"
metrics-exporter-prometheus = "0.17"
hex = "0.4.3"
tokio-util = "0.7.18"
rand = "0.8"
rand_distr = "0.6.0"

# Kafka
rdkafka = { version = "0.37", features = ["zstd"] }

# RabbitMQ
lapin = "2.5"
futures-util = "0.3"

[build-dependencies]
buffa-build = "0.2.0"
connectrpc-build = "0.2.0"
